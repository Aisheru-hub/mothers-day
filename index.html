<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>День матери</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f8eee6; color: #482d31; font-family: system-ui, sans-serif; }
    main { width: min(100%, 668px); }
    h1 { font: 400 clamp(2.5rem, 9vw, 5rem)/1 Georgia, serif; margin: 0 0 .6em; }
    nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 14px; }
    a { display: block; padding: 24px; border-radius: 14px; background: #f7dce2; color: #482d31; text-decoration: none; font-weight: 700; }
    a:first-child { background: #26251b; color: #ffda76; }
    a:hover { text-decoration: underline; }
    a:focus-visible { outline: 3px solid #904253; outline-offset: 5px; }
  </style>
</head>
<body>
  <main>
    <h1>День матери</h1>
    <nav aria-label="Поздравления">
      <a href="irina/index.html">Для мамы Иры</a>
      <a href="natasha/index.html">Для мамы Наташи</a>
    </nav>
  </main>
</body>
</html>
